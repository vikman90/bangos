name: Release Assets

on:
  release:
    types: [published, prereleased]

jobs:
  build-and-release:
    name: Build and Upload Release Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gnu-efi \
            nasm \
            musl \
            musl-tools \
            e2fsprogs \
            qemu-system-x86 \
            ovmf \
            python3 \
            tar \
            zip

      - name: Build & Run Automated QEMU Verification
        run: |
          make clean
          make test

      - name: Build Release Distribution Archives
        run: |
          make dist VERSION=${{ github.ref_name }}

      - name: Upload Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bangos-${{ github.ref_name }}-x86_64.zip
            build/bangos-${{ github.ref_name }}-x86_64.tar.gz
            build/esp/EFI/BOOT/BOOTX64.EFI
            build/esp/initrd.tar
            build/disk.img
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
