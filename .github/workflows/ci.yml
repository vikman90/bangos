name: BangOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gnu-efi nasm qemu-system-x86 ovmf musl musl-tools python3

      - name: Build BangOS ESP Image
        run: |
          make esp

      - name: Run Automated QEMU Bare-Metal Tests
        run: |
          make test
